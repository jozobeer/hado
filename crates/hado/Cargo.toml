[package]
name = "hado"
version = "0.1.0"
edition = "2021"
# tests/ のファイルは 2 本の二進に束ねる（tests/command.rs・tests/compiler.rs）。
autotests = false

[dependencies]
cranelift-codegen = "0.135"
cranelift-frontend = "0.135"
cranelift-jit = "0.135"
cranelift-module = "0.135"
cranelift-object = "0.135"
cranelift-native = "0.135"
serde_json = "1.0.151"

[build-dependencies]
cc = "1"

[[test]]
name = "command"
path = "tests/command.rs"

[[test]]
name = "compiler"
path = "tests/compiler.rs"
