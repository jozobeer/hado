# CI（docs/rounds/ci.md）。回す層と門番の一覧はこのファイルに書かない。
# 層は scripts/ci-run.sh が選び、中身は scripts/lib/gate-tiers.sh が唯一の正。
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tier:
        description: 回す層（空なら full）
        type: choice
        options:
          - quick
          - core
          - full
        default: full

permissions:
  contents: read

# 古い走行は PR のときだけ打ち切る。push と workflow_dispatch は走行ごとに別の群にして、
# pending の走行が次の push に置き換わらないようにする（同じ群では cancel-in-progress が
# false でも pending は新しい走行に置き換わる。docs/rounds/ci.md）。
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# ローカルのコマンドは --offline が前提（AGENTS.md）。network を開けるのは
# 依存を取得する段だけにする。
env:
  CARGO_NET_OFFLINE: "true"
  CARGO_TERM_COLOR: never

jobs:
  gates:
    # public なので standard runner は無料。誰でも PR を出せるため、PR のコードを sudo の
    # 通る自前 runner で走らせない（docs/rounds/ci-public.md、docs/rounds/ci.md の決定 12）。
    runs-on: ubuntu-latest
    # full 層は自前 runner で 60 分を超える。2026-10-12 の走行 38257234801 は m0 だけで
    # 40 分 01 秒、m1-corpus に 8 分 37 秒、m2 を 11 分 26 秒走ったところで job timeout に
    # 当たり cancelled になった（docs/rounds/ci-full-timeout.md）。GitHub Actions の上限に
    # 合わせて 360 分まで許す。門番の判定は変えない。
    timeout-minutes: 360
    # 全体テストを tests の台に、m0 以外の門番を gates の台に分けて同時に回す。各 job は
    # 自分の checkout でビルドし、scripts/ci-run.sh が tests:I/N・gates:I/N の取り分を選ぶ
    # （docs/rounds/ci-shards.md）。
    strategy:
      fail-fast: false
      matrix:
        shard: [tests:1/3, tests:2/3, tests:3/3, gates:1/5, gates:2/5, gates:3/5, gates:4/5, gates:5/5]
    steps:
      # PR の merge commit と 1 番目の親（取り込み先の先端）を取る。scripts/ci-run.sh が
      # 差分を見て、文書だけの PR では門番を省く（docs/rounds/ci-docs-only.md）。
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      # libgc-dev は runtime/hado_runtime.c の <gc.h> と -lgc に要る。image の索引で
      # 入らないときだけ apt-get update する（update が段の所要の大半を占める）。
      - name: runtime dependencies
        run: |
          sudo apt-get install -y --no-install-recommends libgc-dev ||
            { sudo apt-get update && sudo apt-get install -y --no-install-recommends libgc-dev; }

      # 依存の tarball だけを保存する。target/ は 4 GB 級なので保存しない
      # （docs/rounds/ci.md の実測）。--offline の門番はこの取得で足りる。
      - name: cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      # 自前の runner は ~/.cargo に Rust を置くので、PATH を通す。standard runner の
      # イメージは元から通っているため、無いときだけ足す（docs/rounds/ci.md の決定 10）。
      - name: cargo on PATH
        run: |
          if ! command -v cargo >/dev/null 2>&1; then
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi

      - name: fetch dependencies
        env:
          CARGO_NET_OFFLINE: "false"
        run: cargo fetch --locked

      - name: toolchain
        run: |
          rustc --version
          cargo --version
          nproc

      # 依存（cranelift など）のビルド成果物。どの台もクリーンからのビルドで 1 分前後を
      # 依存に使う。target/ 全体（4 GB 級、docs/rounds/ci.md の決定 5）ではなく、hado 自身を
      # 消した target/ を保存する（docs/rounds/ci-shards.md）。鍵は依存の版・toolchain・profile。
      - name: restore dependency build
        id: deps
        uses: actions/cache/restore@v6
        with:
          path: target
          key: deps-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'Cargo.toml') }}

      - name: gates
        run: bash scripts/ci-run.sh "${{ github.event_name }}" "${{ github.ref }}" "${{ inputs.tier }}" "${{ matrix.shard }}"

      # 緑の走行でも残す。台ごとの所要（ビルド・テストのコンパイル・切れの実行）は
      # 門番のログにしか出ない（docs/rounds/ci-shards.md）。
      - name: gate logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gate-logs-${{ strategy.job-index }}
          path: target/ci-gates
          if-no-files-found: ignore
          retention-days: 14

      # 鍵が外れたときは、tests:1 の台が依存を含む target/ を保存する。hado 自身の成果物と
      # 門番のログは保存しない（チェックアウトのたびに hado はビルドし直される）。
      - name: prune target for the dependency cache
        if: steps.deps.outputs.cache-hit != 'true' && matrix.shard == 'tests:1/3'
        run: |
          cargo clean --offline -p hado
          rm -rf target/ci-gates target/nextest
          du -sh target

      - name: save dependency build
        if: steps.deps.outputs.cache-hit != 'true' && matrix.shard == 'tests:1/3'
        uses: actions/cache/save@v6
        with:
          path: target
          key: ${{ steps.deps.outputs.cache-primary-key }}
