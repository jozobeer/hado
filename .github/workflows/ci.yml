# CI（docs/rounds/ci.md）。回す層と門番の一覧はこのファイルに書かない。
# 層は scripts/ci-run.sh が選び、中身は scripts/lib/gate-tiers.sh が唯一の正。
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tier:
        description: 回す層（空なら full）
        type: choice
        options:
          - quick
          - core
          - full
        default: full

permissions:
  contents: read

# 古い走行は PR のときだけ打ち切る。push と workflow_dispatch は走行ごとに別の群にして、
# pending の走行が次の push に置き換わらないようにする（同じ群では cancel-in-progress が
# false でも pending は新しい走行に置き換わる。docs/rounds/ci.md）。
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# ローカルのコマンドは --offline が前提（AGENTS.md）。network を開けるのは
# 依存を取得する段だけにする。
env:
  CARGO_NET_OFFLINE: "true"
  CARGO_TERM_COLOR: never

jobs:
  gates:
    # private のあいだは org の Free 枠（2000 分/月）と spending limit に当たるので、
    # 自前の Linux x86_64 runner で回す（docs/rounds/ci.md の決定 9）。public にしたら
    # standard runner が無料になるので ubuntu-latest に戻す（門番はどちらも受ける）。
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # libgc-dev は runtime/hado_runtime.c の <gc.h> と -lgc に要る。
      # python3-yaml は門番 scripts/verify-ci.sh がワークフローを読むのに使う。
      - name: runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgc-dev python3-yaml

      # 依存の tarball だけを保存する。target/ は 4 GB 級なので保存しない
      # （docs/rounds/ci.md の実測）。--offline の門番はこの取得で足りる。
      - name: cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: fetch dependencies
        env:
          CARGO_NET_OFFLINE: "false"
        run: cargo fetch --locked

      - name: toolchain
        run: |
          rustc --version
          cargo --version
          nproc

      - name: gates
        run: bash scripts/ci-run.sh "${{ github.event_name }}" "${{ github.ref }}" "${{ inputs.tier }}"

      - name: gate logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: gate-logs
          path: target/ci-gates
          if-no-files-found: ignore
