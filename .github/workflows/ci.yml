# CI（docs/rounds/ci.md）。回す層と門番の一覧はこのファイルに書かない。
# 層は scripts/ci-run.sh が選び、中身は scripts/lib/gate-tiers.sh が唯一の正。
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tier:
        description: 回す層（空なら full）
        type: choice
        options:
          - quick
          - core
          - full
        default: full

permissions:
  contents: read

# 同じ ref の古い走行は PR のときだけ打ち切る。main の走行は打ち切らない。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# ローカルのコマンドは --offline が前提（AGENTS.md）。network を開けるのは
# 依存を取得する段だけにする。
env:
  CARGO_NET_OFFLINE: "true"
  CARGO_TERM_COLOR: never

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # libgc-dev は runtime/hado_runtime.c の <gc.h> と -lgc に要る。
      # python3-yaml は門番 scripts/verify-ci.sh がワークフローを読むのに使う。
      - name: runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgc-dev python3-yaml

      # 依存の tarball だけを保存する。target/ は 4 GB 級なので保存しない
      # （docs/rounds/ci.md の実測）。--offline の門番はこの取得で足りる。
      - name: cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: fetch dependencies
        env:
          CARGO_NET_OFFLINE: "false"
        run: cargo fetch --locked

      - name: toolchain
        run: |
          rustc --version
          cargo --version
          nproc

      - name: gates
        run: bash scripts/ci-run.sh "${{ github.event_name }}" "${{ github.ref }}" "${{ inputs.tier }}"

      - name: gate logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: gate-logs
          path: target/ci-gates
          if-no-files-found: ignore
